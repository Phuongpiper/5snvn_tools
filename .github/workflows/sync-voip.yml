name: Auto Sync VoIP Calls

on:
  # Chạy tự động lúc 7:00 sáng giờ Việt Nam (= 00:00 UTC)
  schedule:
    - cron: '0 0 * * *'

  # Cho phép chạy thủ công từ GitHub Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run VoIP sync
        env:
          R2_ACCOUNT_ID_DYLAN: ${{ secrets.R2_ACCOUNT_ID_DYLAN }}
          R2_ACCESS_KEY_ID_DYLAN: ${{ secrets.R2_ACCESS_KEY_ID_DYLAN }}
          R2_SECRET_ACCESS_KEY_DYLAN: ${{ secrets.R2_SECRET_ACCESS_KEY_DYLAN }}
          R2_BUCKET_NAME_DYLAN: ${{ secrets.R2_BUCKET_NAME_DYLAN }}
          MISSCALL_USERID: ${{ secrets.MISSCALL_USERID }}
          MISSCALL_PASS: ${{ secrets.MISSCALL_PASS }}
        run: node sync-voip.js
