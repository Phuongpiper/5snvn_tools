<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Văn mẫu NVN</title>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ── Tokens (Indigo Precision) ── */
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --accent-bg: #eef2ff;
      --accent-border: #c7d2fe;
      --header-bg: #f8fafc;
      --header-text: #475569;
      --mark-bg: #fef08a;
      --row-alt: #fcfcfd;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 12px;
      --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.03);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --success: #10b981;
      --danger: #ef4444;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.55;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .page {
      max-width: 1560px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* ── Hero ── */
    .hero {
      margin-bottom: 24px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .hero-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
    }

    .hero h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 3px;
      letter-spacing: -0.3px;
    }

    .hero p {
      font-size: 13px;
      color: var(--text-secondary);
    }

    /* ── Action Bar / Search Toolbar ── */
    .action-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 300px;
    }

    .search-container {
      position: relative;
      flex: 1;
      max-width: 600px;
    }

    .search-input {
      width: 100%;
      padding: 9px 36px 9px 38px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      background: var(--surface);
      color: var(--text-primary);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .clear-input-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: #f1f5f9;
      color: #64748b;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      padding: 0;
      line-height: 1;
      transition: all 0.15s ease;
      z-index: 2;
    }

    .clear-input-btn:hover {
      background: #fee2e2;
      color: #ef4444;
    }

    .clear-all-btn {
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border: 1px solid #fca5a5;
      border-radius: var(--radius-sm);
      background: #fff5f5;
      color: #dc2626;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .clear-all-btn:hover {
      background: #fee2e2;
      border-color: #f87171;
    }

    .action-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .result-badge {
      background: var(--accent-bg);
      color: var(--accent-dark);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cloud-badge {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      border-radius: var(--radius-sm);
      padding: 6px 11px;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .cloud-badge.error {
      background: #fef2f2;
      color: #b91c1c;
      border-color: #fecaca;
    }

    .btn-sync {
      background: #ffffff;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
      white-space: nowrap;
    }

    .btn-sync:hover {
      background: var(--accent-bg);
      border-color: var(--accent-border);
      color: var(--accent);
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      margin-bottom: 14px;
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    /* ── Table style ── */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #1e293b;
      color: #f8fafc;
      font-weight: 700;
      padding: 12px 16px;
      font-size: 11.5px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-bottom: 2px solid #0f172a;
    }

    th:first-child {
      border-top-left-radius: var(--radius-sm);
    }

    th:last-child {
      border-top-right-radius: var(--radius-sm);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
      font-size: 14px;
    }

    tr:nth-child(even) td {
      background: var(--row-alt);
    }

    tr:hover td {
      background: var(--accent-bg);
    }

    .col-stt {
      width: 60px;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: center;
    }

    .col-en {
      width: 35%;
    }

    .col-vi {
      width: 35%;
    }

    .col-note {
      width: 15%;
      color: #6b7280;
    }

    .col-actions {
      width: 120px;
      text-align: center;
    }

    /* ── Copy Block ── */
    .copyable-cell {
      position: relative;
      cursor: pointer;
      padding-right: 36px;
      white-space: pre-wrap;
      word-break: break-word;
      transition: background-color 0.15s;
    }

    .copyable-cell:hover {
      color: var(--accent-dark);
    }

    .copy-btn {
      position: absolute;
      right: 6px;
      top: 6px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: var(--text-secondary);
      opacity: 0.75;
      width: 28px;
      height: 28px;
      font-size: 15px;
      /* Kích thước icon tăng 1.2x */
      padding: 0;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .copyable-cell:hover .copy-btn {
      opacity: 1;
      background: var(--accent-bg);
      border-color: var(--accent-border);
      color: var(--accent-dark);
    }

    .copy-btn:hover {
      background: var(--accent) !important;
      color: #ffffff !important;
      border-color: var(--accent) !important;
      transform: scale(1.18);
    }

    .copy-btn.copied {
      background: #dcfce7 !important;
      color: #166534 !important;
      border-color: #86efac !important;
    }

    /* ── Buttons ── */
    button {
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      padding: 8px 14px;
      white-space: nowrap;
      transition: background-color 0.15s, border-color 0.15s, color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .btn-outline:hover {
      background: var(--row-alt);
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn-edit {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #334155;
      padding: 6px;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn-edit:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
      color: var(--accent-dark);
    }

    .btn-delete {
      background: #fff5f5;
      border: 1px solid #fee2e2;
      color: #ef4444;
      padding: 6px;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-delete:hover {
      background: #fee2e2;
      border-color: #fca5a5;
    }

    /* ── Config URL Panel ── */
    .config-panel {
      display: none;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
      background: #fff;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }

    .config-panel label {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
    }

    .config-panel input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 13px;
      outline: none;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 1000;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-container {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      transform: translateY(-20px);
      transition: transform 0.25s ease;
    }

    .modal-overlay.show .modal-container {
      transform: translateY(0);
    }

    .modal-header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
    }

    .modal-close {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
    }

    .modal-close:hover {
      color: #ffffff;
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
      max-width: 100%;
      box-sizing: border-box;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
    }

    .modal-footer {
      padding: 12px 20px;
      background: var(--row-alt);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* ── Toast notification ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1100;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #1f2937;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(20px);
      animation: toastIn 0.3s forwards, toastOut 0.3s 2.7s forwards;
    }

    .toast.toast-success {
      border-left: 4px solid var(--success);
    }

    .toast.toast-error {
      border-left: 4px solid var(--danger);
    }

    @keyframes toastIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(-20px);
      }
    }

    /* ── Loading Overlay ── */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--accent-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ── Text truncation in table ── */
    .cell-text {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.55;
      max-height: 4.65em;
      /* 3 lines */
    }

    /* ── View detail button (small eye icon) ── */
    .btn-view-detail {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: #e0e7ff;
      border: 1px solid #c7d2fe;
      color: var(--accent-dark);
      opacity: 0;
      width: 24px;
      height: 24px;
      font-size: 11px;
      padding: 0;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .copyable-cell:hover .btn-view-detail {
      opacity: 1;
    }

    .btn-view-detail:hover {
      background: var(--accent) !important;
      color: #fff !important;
      border-color: var(--accent) !important;
      transform: scale(1.1);
    }

    /* ── Detail Popup Modal ── */
    #detailModal .modal-container {
      max-width: 680px;
    }

    .detail-section {
      margin-bottom: 18px;
    }

    .detail-section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-dark);
      margin-bottom: 6px;
    }

    .detail-section-content {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-primary);
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      position: relative;
    }

    .detail-copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
      border-radius: var(--radius-sm);
      width: 28px;
      height: 28px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .detail-copy-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .detail-copy-btn.copied {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="hero">
      <div class="hero-icon"><i class="fa-solid fa-file-lines"></i></div>
      <div>
        <h1>Văn mẫu NVN</h1>
        <p>Quản lý và tra cứu nhanh các câu văn mẫu tiếng Anh/tiếng Việt phục vụ hỗ trợ khách hàng.</p>
      </div>
    </div>

    <div class="action-bar">
      <div class="search-group">
        <div class="search-container">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" class="search-input" id="searchBar"
            placeholder="Tìm kiếm nhanh Tiếng Anh, Tiếng Việt, Note..." oninput="handleSearch()" autocomplete="off" />
          <button type="button" class="clear-input-btn" id="clearSearchBar" title="Xóa nội dung">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <button type="button" class="clear-all-btn" id="clearAllSearchBtn" onclick="clearSearch()" title="Xoá tìm kiếm">
          <i class="fa-solid fa-broom"></i> Xoá tìm kiếm
        </button>
      </div>
      <div class="action-group">
        <div class="result-badge" id="countBadge">
          <i class="fa-solid fa-layer-group"></i> 0 mẫu
        </div>
        <button class="btn-primary" onclick="openAddModal()">
          <i class="fa-solid fa-plus"></i>
          Thêm mới mẫu
        </button>
      </div>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table id="templatesTable">
          <thead>
            <tr>
              <th class="col-stt">STT</th>
              <th class="col-en">Tiếng Anh</th>
              <th class="col-vi">Tiếng Việt</th>
              <th class="col-note">Note</th>
              <th class="col-actions">Thao tác</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- Loading indicator hoặc Dữ liệu sẽ render ở đây -->
            <tr>
              <td colspan="5">
                <div class="loading-container">
                  <div class="spinner"></div>
                  <div>Đang tải dữ liệu từ Cloudflare R2...</div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Thêm / Sửa -->
  <div class="modal-overlay" id="formModal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitle">Thêm mới câu văn mẫu</h3>
        <button class="modal-close" onclick="closeModal()" title="Đóng"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="templateForm" onsubmit="handleSubmit(event)">
        <input type="hidden" id="templateId" />
        <div class="modal-body">
          <div class="form-group">
            <label for="englishInput">Tiếng Anh <span style="color:var(--danger)">*</span></label>
            <textarea class="form-control" id="englishInput" rows="3" placeholder="Nhập câu tiếng Anh..."
              required></textarea>
          </div>
          <div class="form-group">
            <label for="vietnameseInput">Tiếng Việt <span style="color:var(--danger)">*</span></label>
            <textarea class="form-control" id="vietnameseInput" rows="3"
              placeholder="Nhập câu tiếng Việt dịch tương ứng..." required></textarea>
          </div>
          <div class="form-group">
            <label for="noteInput">Note (Ghi chú)</label>
            <input type="text" class="form-control" id="noteInput"
              placeholder="Ví dụ: Dùng khi cấu hình máy, Mail cho HQ..." />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-outline" onclick="closeModal()"><i class="fa-solid fa-xmark"></i>
            Đóng</button>
          <button type="submit" class="btn-primary" id="btnSubmit"><i class="fa-solid fa-floppy-disk"></i> Lưu
            lại</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Xem chi tiết -->
  <div class="modal-overlay" id="detailModal" onclick="closeDetailModal(event)">
    <div class="modal-container">
      <div class="modal-header">
        <h3><i class="fa-regular fa-eye" style="margin-right:8px;"></i>Xem chi tiết câu văn mẫu</h3>
        <button class="modal-close" onclick="closeDetailModal()" title="Đóng"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" id="detailModalBody">
        <!-- filled by JS -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-outline" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i>
          Đóng</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    let allTemplates = [];
    let filteredTemplates = [];
    let isCloudLoading = false;

    // Real-time broadcast channel giữa các tab
    const vmBroadcast = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel("DMS_VANMAU_SYNC") : null;
    if (vmBroadcast) {
      vmBroadcast.onmessage = (e) => {
        if (e.data && e.data.type === "VANMAU_UPDATED") {
          console.log("[Broadcast] Nhận tín hiệu cập nhật Văn mẫu từ tab khác");
          loadData(true);
        }
      };
    }

    // Endpoint API R2
    function getVanMauApiEndpoint(queryParam = "") {
      let base = "";
      if (window.location.protocol === "file:") {
        base = "https://5snvn-tools.vercel.app";
      } else if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        if (window.location.port !== "3000") {
          base = "http://localhost:3000";
        } else {
          base = "";
        }
      } else {
        base = "";
      }
      const sep = queryParam ? (queryParam.startsWith("?") ? "" : "?") : "";
      return base + "/api/r2-vanmau" + (queryParam ? sep + queryParam : "");
    }

    // Cập nhật huy hiệu trạng thái Cloud
    function updateCloudStatus(text, isError = false) {
      const badge = document.getElementById("cloudStatusBadge");
      if (!badge) return;
      if (isError) {
        badge.className = "cloud-badge error";
        badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> ${text}`;
      } else {
        badge.className = "cloud-badge";
        badge.innerHTML = `<i class="fa-solid fa-cloud-check"></i> ${text}`;
      }
    }

    // Tải dữ liệu từ R2 (có hỗ trợ cache localStorage hiển thị tức thì)
    async function loadData(isSilent = false) {
      if (isCloudLoading) return;
      isCloudLoading = true;

      const tbody = document.getElementById("tableBody");
      const syncIcon = document.getElementById("syncIcon");
      if (syncIcon) syncIcon.classList.add("fa-spin");

      // Nếu chưa có dữ liệu nào và không silent thì hiện spinner
      if (!isSilent && (!allTemplates || allTemplates.length === 0)) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="loading-container">
                <div class="spinner"></div>
                <div>Đang tải dữ liệu từ Cloudflare R2...</div>
              </div>
            </td>
          </tr>
        `;
      }

      try {
        const url = getVanMauApiEndpoint("t=" + Date.now());
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        const result = await response.json();

        if (result.status === "success" && Array.isArray(result.data)) {
          allTemplates = result.data;
          filteredTemplates = [...allTemplates];
          localStorage.setItem("NVN_VANMAU_CACHE", JSON.stringify(allTemplates));
          renderTable();
          updateCloudStatus(`R2 (${allTemplates.length} mẫu)`);
          if (!isSilent) {
            showToast(`Đã đồng bộ ${allTemplates.length} câu văn mẫu từ Cloud R2!`, "success");
          }
        } else {
          throw new Error(result.message || "Dữ liệu trả về không hợp lệ");
        }
      } catch (error) {
        console.error("Lỗi tải từ R2:", error);
        updateCloudStatus("Lỗi kết nối R2", true);

        // Fallback đọc từ cache nếu có
        const cached = localStorage.getItem("NVN_VANMAU_CACHE");
        if (cached) {
          try {
            allTemplates = JSON.parse(cached);
            filteredTemplates = [...allTemplates];
            renderTable();
            showToast("Đang hiển thị bản lưu gần nhất (Offline)", "error");
          } catch (_) { }
        } else {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="empty-state">
                <div style="color: var(--danger); font-weight:600; margin-bottom:8px;">Không thể tải dữ liệu từ Cloud R2</div>
                <div style="font-size:12px; color:#64748b;">${error.message || "Vui lòng kiểm tra lại kết nối mạng hoặc thử lại."}</div>
              </td>
            </tr>
          `;
        }
      } finally {
        isCloudLoading = false;
        if (syncIcon) syncIcon.classList.remove("fa-spin");
      }
    }

    // Render bảng dữ liệu
    function renderTable() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      // Update count badge
      const countEl = document.getElementById("countBadge");
      if (countEl) {
        if (!allTemplates.length) {
          countEl.innerHTML = `<i class="fa-solid fa-layer-group"></i> 0 mẫu`;
        } else if (allTemplates.length === filteredTemplates.length) {
          countEl.innerHTML = `<i class="fa-solid fa-layer-group"></i> <strong>${allTemplates.length}</strong> mẫu`;
        } else {
          countEl.innerHTML = `<i class="fa-solid fa-filter"></i> <strong>${filteredTemplates.length}</strong> / ${allTemplates.length} mẫu`;
        }
      }

      if (filteredTemplates.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Không tìm thấy kết quả nào phù hợp.</td></tr>`;
        return;
      }

      filteredTemplates.forEach((item, index) => {
        const tr = document.createElement("tr");

        // Cell STT
        const tdStt = document.createElement("td");
        tdStt.className = "col-stt";
        tdStt.textContent = index + 1;
        tr.appendChild(tdStt);

        // Helper: build a copyable cell with truncation + copy btn + view-detail btn
        function makeCopyCell(cls, text) {
          const td = document.createElement("td");
          td.style.position = "relative";

          const isEmpty = !text || !text.trim();

          if (isEmpty) {
            td.className = cls;
            const placeholder = document.createElement("span");
            placeholder.textContent = "TRỐNG";
            placeholder.style.cssText = "font-style:italic; color:#cbd5e1; font-size:12px; font-weight:500; letter-spacing:0.3px;";
            td.appendChild(placeholder);
            return { td, copyBtn: null };
          }

          td.className = cls + " copyable-cell";
          td.title = "Click để copy";

          const textEl = document.createElement("div");
          textEl.className = "cell-text";
          textEl.textContent = text;
          td.appendChild(textEl);

          const copyBtn = document.createElement("button");
          copyBtn.className = "copy-btn";
          copyBtn.title = "Click để copy";
          copyBtn.innerHTML = `<i class="fa-regular fa-copy"></i>`;
          copyBtn.onclick = (e) => { e.stopPropagation(); copyText(text, copyBtn); };
          td.onclick = (e) => { if (e.target.closest('.copy-btn') || e.target.closest('.btn-view-detail')) return; copyText(text, copyBtn); };
          td.appendChild(copyBtn);

          // View detail button (eye icon, bottom-right)
          const viewBtn = document.createElement("button");
          viewBtn.className = "btn-view-detail";
          viewBtn.title = "Xem chi tiết";
          viewBtn.innerHTML = `<i class="fa-regular fa-eye"></i>`;
          viewBtn.onclick = (e) => { e.stopPropagation(); openDetailModal(item); };
          td.appendChild(viewBtn);

          return { td, copyBtn };
        }

        // Cell Tiếng Anh
        const { td: tdEn } = makeCopyCell("col-en", item.english);
        tr.appendChild(tdEn);

        // Cell Tiếng Việt
        const { td: tdVi } = makeCopyCell("col-vi", item.vietnamese);
        tr.appendChild(tdVi);

        // Cell Note
        const tdNote = document.createElement("td");
        tdNote.className = "col-note";
        if (item.note && item.note.trim()) {
          tdNote.textContent = item.note;
        } else {
          const placeholder = document.createElement("span");
          placeholder.textContent = "TRỐNG";
          placeholder.style.cssText = "font-style:italic; color:#cbd5e1; font-size:12px; font-weight:500; letter-spacing:0.3px;";
          tdNote.appendChild(placeholder);
        }
        tr.appendChild(tdNote);

        // Cell Actions
        const tdActions = document.createElement("td");
        tdActions.className = "col-actions";

        const actionWrap = document.createElement("div");
        actionWrap.style.cssText = "display:flex; justify-content:center; align-items:center; gap:6px;";

        const btnEdit = document.createElement("button");
        btnEdit.className = "btn-edit";
        btnEdit.title = "Sửa câu mẫu";
        btnEdit.innerHTML = `<i class="fa-solid fa-pen-to-square"></i>`;
        btnEdit.onclick = () => openEditModal(item);

        const btnDel = document.createElement("button");
        btnDel.className = "btn-delete";
        btnDel.title = "Xóa câu mẫu";
        btnDel.innerHTML = `<i class="fa-solid fa-trash-can"></i>`;
        btnDel.onclick = () => handleDelete(item.id, item.english || item.vietnamese);

        actionWrap.appendChild(btnEdit);
        actionWrap.appendChild(btnDel);
        tdActions.appendChild(actionWrap);
        tr.appendChild(tdActions);

        tbody.appendChild(tr);
      });
    }

    // Sao chép văn bản vào Clipboard
    function copyText(text, btnElement) {
      if (!text) return;
      const onCopied = () => {
        showToast("Đã copy vào bộ nhớ tạm!", "success");
        if (btnElement) {
          btnElement.classList.add("copied");
          btnElement.innerHTML = `<i class="fa-solid fa-check" style="color:#166534;"></i>`;
          setTimeout(() => {
            btnElement.classList.remove("copied");
            btnElement.innerHTML = `<i class="fa-regular fa-copy"></i>`;
          }, 1200);
        }
      };

      navigator.clipboard.writeText(text).then(() => {
        onCopied();
      }).catch(err => {
        console.error("Lỗi copy:", err);
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          onCopied();
        } catch (e) {
          showToast("Không thể copy!", "error");
        }
        document.body.removeChild(textarea);
      });
    }

    // Hiển thị thông báo Toast
    function showToast(message, type = "success") {
      const container = document.getElementById("toastContainer");
      if (!container) return;
      const toast = document.createElement("div");
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <span>${type === "success" ? "✔️" : "❌"}</span>
        <span>${message}</span>
      `;
      container.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, 3000);
    }

    // Mở popup xem chi tiết
    function openDetailModal(item) {
      const body = document.getElementById("detailModalBody");
      function sectionHTML(label, text) {
        if (!text) return "";
        const safe = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
        return `
          <div class="detail-section">
            <div class="detail-section-label">${label}</div>
            <div class="detail-section-content" style="padding-right:44px;">
              <pre style="margin:0;font-family:inherit;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;">${safe}</pre>
              <button class="detail-copy-btn" title="Copy" onclick="detailCopy(this)">
                <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>`;
      }
      body.innerHTML =
        sectionHTML("🇬🇧 Tiếng Anh", item.english) +
        sectionHTML("🇻🇳 Tiếng Việt", item.vietnamese) +
        (item.note ? `<div class="detail-section"><div class="detail-section-label">📝 Note</div><div class="detail-section-content" style="padding-right:44px;"><pre style="margin:0;font-family:inherit;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;">${item.note.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre><button class="detail-copy-btn" title="Copy" onclick="detailCopy(this)"><i class="fa-regular fa-copy"></i></button></div></div>` : "");
      body.scrollTop = 0;
      body.scrollLeft = 0;
      document.getElementById("detailModal").classList.add("show");
    }

    function detailCopy(btn) {
      const pre = btn.closest(".detail-section-content")?.querySelector("pre");
      const text = pre ? pre.textContent : "";
      navigator.clipboard.writeText(text).then(() => {
        btn.innerHTML = `<i class="fa-solid fa-check"></i>`;
        btn.classList.add("copied");
        showToast("Đã copy vào bộ nhớ tạm!", "success");
        setTimeout(() => {
          btn.innerHTML = `<i class="fa-regular fa-copy"></i>`;
          btn.classList.remove("copied");
        }, 1500);
      }).catch(() => showToast("Không thể copy!", "error"));
    }

    function closeDetailModal(e) {
      if (e && e.target !== document.getElementById("detailModal")) return;
      document.getElementById("detailModal").classList.remove("show");
    }

    // Xử lý Tìm kiếm
    function handleSearch() {
      const searchInput = document.getElementById("searchBar");
      const clearBtn = document.getElementById("clearSearchBar");
      const clearAllBtn = document.getElementById("clearAllSearchBtn");
      const query = (searchInput ? searchInput.value : "").toLowerCase().trim();
      const hasVal = searchInput && searchInput.value;
      if (clearBtn) {
        clearBtn.style.display = hasVal ? "inline-flex" : "none";
      }
      if (clearAllBtn) {
        clearAllBtn.style.display = hasVal ? "inline-flex" : "none";
      }
      if (!query) {
        filteredTemplates = [...allTemplates];
      } else {
        filteredTemplates = allTemplates.filter(item => {
          const en = (item.english || "").toLowerCase();
          const vi = (item.vietnamese || "").toLowerCase();
          const note = (item.note || "").toLowerCase();
          return en.includes(query) || vi.includes(query) || note.includes(query);
        });
      }
      renderTable();
    }

    function clearSearch() {
      const searchInput = document.getElementById("searchBar");
      if (searchInput) {
        searchInput.value = "";
        searchInput.focus();
      }
      handleSearch();
    }

    // Mở Modal Thêm mới
    function openAddModal() {
      document.getElementById("modalTitle").textContent = "Thêm mới câu văn mẫu (Lưu lên R2)";
      document.getElementById("templateId").value = "";
      document.getElementById("englishInput").value = "";
      document.getElementById("vietnameseInput").value = "";
      document.getElementById("noteInput").value = "";

      const modal = document.getElementById("formModal");
      modal.classList.add("show");
      setTimeout(() => document.getElementById("englishInput")?.focus(), 150);
    }

    // Mở Modal Sửa
    function openEditModal(item) {
      document.getElementById("modalTitle").textContent = "Cập nhật câu văn mẫu (R2)";
      document.getElementById("templateId").value = item.id;
      document.getElementById("englishInput").value = item.english || "";
      document.getElementById("vietnameseInput").value = item.vietnamese || "";
      document.getElementById("noteInput").value = item.note || "";

      const modal = document.getElementById("formModal");
      modal.classList.add("show");
      setTimeout(() => document.getElementById("englishInput")?.focus(), 150);
    }

    // Đóng Modal
    function closeModal() {
      const modal = document.getElementById("formModal");
      modal.classList.remove("show");
    }

    // Xử lý Lưu Thêm mới / Sửa cập nhật trực tiếp lên Cloudflare R2
    async function handleSubmit(event) {
      event.preventDefault();

      const id = document.getElementById("templateId").value;
      const english = document.getElementById("englishInput").value.trim();
      const vietnamese = document.getElementById("vietnameseInput").value.trim();
      const note = document.getElementById("noteInput").value.trim();

      if (!english && !vietnamese) {
        showToast("Vui lòng nhập ít nhất Tiếng Anh hoặc Tiếng Việt!", "error");
        return;
      }

      const btnSubmit = document.getElementById("btnSubmit");
      const originalBtnText = btnSubmit.innerHTML;
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu lên R2...`;

      const isEdit = id !== "";
      const payload = {
        action: isEdit ? "update" : "create",
        english: english,
        vietnamese: vietnamese,
        note: note
      };

      if (isEdit) {
        payload.id = parseInt(id);
      }

      try {
        const response = await fetch(getVanMauApiEndpoint(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === "success") {
          showToast(isEdit ? "Cập nhật câu văn mẫu thành công!" : "Thêm mới câu văn mẫu thành công!", "success");
          closeModal();

          // Phát tín hiệu đồng bộ realtime sang các tab khác
          if (vmBroadcast) {
            try { vmBroadcast.postMessage({ type: "VANMAU_UPDATED" }); } catch (_) { }
          }

          await loadData(true);
        } else {
          showToast("Có lỗi xảy ra: " + (result.message || "Không rõ"), "error");
        }
      } catch (error) {
        console.error("Lỗi khi lưu lên R2:", error);
        showToast("Lỗi kết nối tới Server R2!", "error");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = originalBtnText;
      }
    }

    // Xóa câu văn mẫu trực tiếp trên R2
    async function handleDelete(id, nameSnippet) {
      const preview = (nameSnippet || "").trim();
      const confirmMsg = `Bạn có chắc chắn muốn xóa câu văn mẫu này khỏi Cloud R2?\n\n"${preview.substring(0, 60)}${preview.length > 60 ? '...' : ''}"`;
      if (!confirm(confirmMsg)) return;

      try {
        const payload = {
          action: "delete",
          id: parseInt(id)
        };

        const response = await fetch(getVanMauApiEndpoint(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.status === "success") {
          showToast("Đã xóa câu văn mẫu thành công khỏi R2!", "success");

          if (vmBroadcast) {
            try { vmBroadcast.postMessage({ type: "VANMAU_UPDATED" }); } catch (_) { }
          }

          await loadData(true);
        } else {
          showToast("Xóa thất bại: " + (result.message || "Không rõ"), "error");
        }
      } catch (error) {
        console.error("Lỗi khi xóa trên R2:", error);
        showToast("Lỗi kết nối khi thực hiện xóa!", "error");
      }
    }

    // Khởi động trang: đọc cache tức thì rồi nạp dữ liệu mới nhất từ R2
    window.onload = async () => {
      const clearSearchBar = document.getElementById("clearSearchBar");
      if (clearSearchBar) {
        clearSearchBar.addEventListener("click", clearSearch);
      }

      // Đọc cache tức thì (zero flash)
      const cached = localStorage.getItem("NVN_VANMAU_CACHE");
      if (cached) {
        try {
          allTemplates = JSON.parse(cached);
          filteredTemplates = [...allTemplates];
          renderTable();
          updateCloudStatus(`R2 (${allTemplates.length} mẫu)`);
        } catch (_) { }
      }

      // Nạp dữ liệu mới nhất từ R2
      loadData(false);

      window.forceSyncWithCloud = () => loadData(false);

      window.addEventListener("pageshow", () => {
        loadData(true);
      });
      window.addEventListener("message", (e) => {
        if (e.data === "tab-activated" || (e.data && (e.data.type === "TAB_ACTIVATED" || e.data.type === "GLOBAL_SYNC_CLICKED"))) {
          loadData(true);
        }
      });
    };
  </script>
</body>

</html>
